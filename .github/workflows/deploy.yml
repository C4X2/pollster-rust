name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pollster-rust:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Transfer Docker image & restart container on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Stream the compressed ~15MB image directly to EC2 Docker daemon
          docker save pollster-rust:latest | gzip | ssh "${EC2_USER}@${EC2_HOST}" "gunzip | docker load"

          # Recreate container while preserving SQLite database on the host
          ssh "${EC2_USER}@${EC2_HOST}" '
            mkdir -p ~/pollster-data
            docker stop pollster 2>/dev/null || true
            docker rm pollster 2>/dev/null || true
            docker run -d \
              --name pollster \
              --restart unless-stopped \
              -p 8085:8085 \
              -v ~/pollster-data:/app/data \
              -e PORT=8085 \
              -e DATABASE_URL=/app/data/pollster.db \
              pollster-rust:latest
            docker image prune -f
          '
